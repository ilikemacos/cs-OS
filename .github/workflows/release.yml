name: release

# Builds and publishes cs-OS.app.
#
#   git tag v0.1.0 && git push --tags
#
# Deliberately does NOT select or use Xcode. The build forces
# DEVELOPER_DIR=/Library/Developer/CommandLineTools and drives swiftc directly,
# exactly as a user's machine does — so a green CI run means the documented
# local build works too, rather than only proving that a runner with Xcode can
# do it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
        default: "0.1.0"
      guest_tag:
        description: "Guest release to bundle"
        required: false
        default: "guest-v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "guest=${{ inputs.guest_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "guest=${CSOS_GUEST_TAG:-guest-v0.1.0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the CLT toolchain (no Xcode)
        run: |
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          swift --version
          xcrun --show-sdk-version

      - name: Cache vendored SwiftTerm
        uses: actions/cache@v4
        with:
          path: third_party
          key: swiftterm-v1.18.0

      - name: Cache guest image
        uses: actions/cache@v4
        with:
          path: guest/dist
          key: guest-${{ steps.ver.outputs.guest }}

      - name: Fetch guest image
        env:
          CSOS_GUEST_TAG: ${{ steps.ver.outputs.guest }}
        run: make guest

      - name: Build and bundle
        run: make bundle VERSION=${{ steps.ver.outputs.version }}

      - name: Verify signature and entitlements
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/cs-OS.app
          # The virtualization entitlement is load-bearing: without it the app
          # builds and launches but can never start a VM.
          codesign -d --entitlements - dist/cs-OS.app 2>/dev/null \
            | tr -d '\0' | grep -q "com.apple.security.virtualization" \
            || { echo "::error::virtualization entitlement missing"; exit 1; }
          # A restricted entitlement on an ad-hoc binary can block launch.
          if codesign -d --entitlements - dist/cs-OS.app 2>/dev/null \
               | tr -d '\0' | grep -q "com.apple.vm.networking"; then
            echo "::error::com.apple.vm.networking must not be in ad-hoc builds"
            exit 1
          fi
          lipo -info dist/cs-OS.app/Contents/MacOS/csos

      - name: Archive
        run: make archive VERSION=${{ steps.ver.outputs.version }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          A="dist/cs-OS-${V}-macos-arm64.tar.gz"
          gh release create "v${V}" "$A" "${A}.sha256" \
            --title "cs-OS v${V}" \
            --notes-file CHANGELOG.md \
            || gh release upload "v${V}" "$A" "${A}.sha256" --clobber
